[package]
name = "aivt-provider-embedding"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aivt-eventbus.workspace = true
async-trait.workspace = true
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
futures.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Pinned to 0.22 (not 0.23) to match `candle-core`'s own internal
# `tokenizers` requirement exactly, so Cargo unifies both into one
# compiled instance instead of two — see the root `Cargo.toml`'s
# `[patch.crates-io]` note for the real MSVC linker issue this
# unification was needed to even diagnose (a duplicate-symbol conflict
# from `esaxx-rs`, one of `tokenizers`' own transitive deps, not from
# having two `tokenizers` versions per se).
tokenizers = "0.22"
tokio = { workspace = true, features = ["macros", "rt", "fs"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
